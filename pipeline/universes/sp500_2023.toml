key = "sp500_2023"
name = "S&P 500 constituents as of 2023-08-30"

# DELIBERATELY NONE. The benchmark for this universe is SPY, and SPY must NOT be a candidate:
# an index fund sitting among its own constituents has lower variance than almost any single
# one of them, so the minimum-variance solve buys it on sight and "did mean-variance beat the
# index" would be asked of a portfolio that is allowed to BE the index. `backtest.py
# --benchmark SPY` prices it without making it investable.
benchmark = ""

groups = ["us_large_cap"]

# An INLINE table, not a `[group_labels]` section -- a section header captures every top-level
# key after it, so `description` would silently become `group_labels.description`.
group_labels = { us_large_cap = "US large cap" }

description = """
The 503 lines that made up the S&P 500 on 2023-08-30, as the index stood that day -- not as
it stands now. That is the whole point of the file. A constituent list downloaded today knows
which companies went on to do well enough to still be in the index, and a backtest over such a
list measures the selection, not the method. This one is the list an investor actually chose
from at the cutoff.

It is still not free of survivorship bias, and the residue has now been MEASURED rather than
bounded. 17 of the 503 have no price from this vendor at any date -- it serves nothing at all
for a ticker that stopped trading, rather than a series that ends -- so they are excluded
below. A second vendor (stockanalysis.com) does serve 12 of the 17, and `pipeline/delisted.py`
fetches them, states what happened to each, and runs the whole backtest again with them
restored. The result contradicts the argument this paragraph used to make. From the cutoff to
each name's own last traded bar the twelve returned +21.8% against SPY's +46.4% over the same
sub-spans, and only 4 of the 12 beat the index; deletion from the S&P 500 is not a synonym for
a takeover premium, and several of these left while badly underperforming (WBA -90.5pp,
IPG -69.9pp, CDAY -64.9pp; CMA is the one large winner at +57.2pp). Restoring them moves an
equal-weighted basket by -0.17 to -0.02 pp/yr depending on the continuation treatment, and it
moves the optimised result not at all: no tangency or matched-risk portfolio held any of the
twelve in any period, under either treatment. The five nobody prices (DFS, HES, MRO, PXD, WRK)
are bounded instead, in `pipeline/results/*_stress.json`. The old claim here -- "+0.18 to
+0.47 pp/yr, most likely UNDERSTATES the result" -- was an argument from the premium and it had
the sign wrong.

Six tickers changed between the cutoff and today and are held under the new one, with the old
spelling in the name. Each was verified by price level years before the change, not by the
rename: a merger that adopts the partner's ticker looks identical in a symbol lookup and is a
splice of two companies. One such case (WestRock) was rejected on exactly that test.

One ticker was RECYCLED, which is the trap none of the above catches: PARA fetches a clean full
series and it is Banzai International, not Paramount. So the constituent is held as PSKY, whose
series IS Paramount's own, and the ticker PARA appears nowhere in this file -- neither as an
asset nor as an exclusion, because nothing about the 2023 constituent is recorded by a symbol
that now belongs to someone else. There is no automatic screen for this -- the check is the
vendor's current company name against the constituent the ticker is supposed to be, and this one
surfaced only because the store's split test failed on the new occupant's reverse splits.

Single group and ticker-as-name, both because the price endpoint carries neither a sector nor a
company name and this file records only what was read. This universe is for `backtest.py`; it
is not built for the page, where the group is the filter row and the name is the tooltip.
"""

[excluded]
# NOT window-filter drops. Those are measured from the prices and reported in the run (ten
# constituents start after the training window opens and stay in [assets] for that reason).
# These are tickers THE PRIMARY VENDOR has no series for at any date, so no window built from the
# store can contain them. "17 of 503 constituents are not in the store" is a fact about the
# result and the reason the bias in the description above is not zero.
#
# Excluded from the STORE, which is not the same as unmeasurable, and the two groups below are
# the difference. The store's contract is one vendor shipping `close`, an event log and an
# `adjclose` to check the reconstruction against; a second vendor that ships a level and nothing
# else cannot go in it (see `pipeline/delisted.py`, which is where these prices live instead).
# So a name stays excluded here even when its outcome is known -- and each row now states the
# outcome rather than asserting the company "left the market".
#
# Twelve are priced by a second vendor. Each row gives the last traded bar it serves and that
# bar's total-return level; the return from the 2023-09-01 cutoff to that date, against SPY over
# the same sub-span; and how it ended. The FINAL bar of each series is dropped before any of
# this is computed -- a delisted series' last print is an index-deletion auction or a stub -- so
# the date and level here are the penultimate bar, and `provenance_*.json` states the size of
# the bar that was dropped.
#
# The date, the level and the two returns are MEASURED. The acquirer and the consideration in
# brackets are from the public record and are here because they are checkable against the level:
# for a cash deal the terminal bar has to sit at the offer (ATVI 94.42 against $95, CTLT 63.48
# against $63.50, JNPR 39.95 against $40, K 83.45 against $83.50), which is also what makes the
# dropped final bar readable rather than mysterious -- CDAY's dropped bar is +1.36% and lands on
# Dayforce's $70.00. Three rows name no acquirer because none was checked this way.
ANSS = "no series from the primary vendor; second vendor to 2025-07-15 at 392.72 (Synopsys, all-stock+cash): +23.1% from the cutoff against SPY's +41.6%"
ATVI = "no series from the primary vendor; second vendor to 2023-10-12 at 94.42 (Microsoft, $95 cash): +2.6% from the cutoff against SPY's -3.6% -- the only name here whose window is six weeks long"
CDAY = "no series from the primary vendor; second vendor to 2026-02-02 at 68.92 (renamed DAY, then taken private by Thoma Bravo): -5.7% from the cutoff against SPY's +59.1%"
CMA = "no series from the primary vendor; second vendor to 2026-01-29 at 92.86 (Fifth Third, all-stock): +116.0% from the cutoff against SPY's +58.8% -- the one large winner among the twelve, and the name whose last bar broke its acquirer ratio by 5.34% and forced the drop-the-final-bar rule"
CTLT = "no series from the primary vendor; second vendor to 2024-12-17 at 63.48 (Novo Holdings, $63.50 cash): +26.5% from the cutoff against SPY's +36.2%"
CTRA = "no series from the primary vendor; second vendor to 2026-05-05 at 35.63: +35.9% from the cutoff against SPY's +66.1%"
DFS = "no series from either vendor at any date, and no US successor ticker -- outcome unpriceable, bounded in pipeline/results/*_stress.json rather than measured"
HES = "no series from either vendor at any date, and no US successor ticker -- outcome unpriceable, bounded in pipeline/results/*_stress.json rather than measured"
HOLX = "no series from the primary vendor; second vendor to 2026-04-02 at 75.65: +0.7% from the cutoff against SPY's +50.5%"
IPG = "no series from the primary vendor; second vendor to 2025-11-25 at 25.06 (Omnicom, all-stock): -15.8% from the cutoff against SPY's +54.0%. Its last bar held 0.35386 x OMC to +-0.21%, so a clean auction print exists and the uniform rule costs 2.0% here"
JNPR = "no series from the primary vendor; second vendor to 2025-07-01 at 39.95 (Hewlett Packard Enterprise, $40 cash): +42.4% from the cutoff against SPY's +40.5%"
K = "no series from the primary vendor; second vendor to 2025-12-09 at 83.45 (Ferrero, $83.50 cash): +59.7% from the cutoff against SPY's +55.9%. Carries the 2023 WK Kellogg spinoff, which the two vendors credit differently -- recorded as a provenance caveat, since there is no second series to resolve it against"
MRO = "no series from either vendor at any date, and no US successor ticker -- outcome unpriceable, bounded in pipeline/results/*_stress.json rather than measured"
PXD = "no series from either vendor at any date, and no US successor ticker -- outcome unpriceable, bounded in pipeline/results/*_stress.json rather than measured"
SEE = "no series from the primary vendor; second vendor to 2026-04-07 at 42.14: +20.3% from the cutoff against SPY's +51.3%"
WBA = "no series from the primary vendor; second vendor to 2025-08-26 at 11.92 (Sycamore Partners, $11.45 cash + rights): -43.7% from the cutoff against SPY's +46.8% -- the worst of the twelve by 20pp"
WRK = "no series from either vendor; the successor SW (Smurfit WestRock) carries Smurfit Kappa's history from 2008, not WestRock's, so there is no continuation to hold and the outcome is bounded rather than measured"

