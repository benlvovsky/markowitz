# The global cross-asset ETF universe: the default, and the one the shipped site is built from.
#
# A universe file is DATA, read with `tomllib` -- not an importable Python module. That is a
# deliberate limit: a universe is a list of tickers with labels plus the argument for why those
# tickers, and nothing in it should be able to run. The consequence is that anyone can add a
# universe without reading `universe.py`, and that `git log pipeline/universes/` is a readable
# history of which instruments were considered when.
#
# Symbol order is the order the file is written in, and it is preserved through to the manifest,
# so the sections below are also the reading order of the asset table in the SPA.
#
# `description` and the `[excluded]` reasons are the two things in here that are RENDERED TO A
# READER, verbatim, in the SPA's own typography -- so they are written with real em dashes and
# real paragraph breaks, unlike these comments, which use `--` like the rest of the source. The
# page cannot fix this for them: a display transform of `--` would also rewrite `--start` and
# `-33%/+50%`, both of which appear in this file's prose on purpose.

key = "etf_global"
name = "Global cross-asset ETFs"

# The benchmark the SPA draws the selected portfolio's growth curve against. It is in `assets`
# too, and that is fine: the frontier may or may not hold it, and the comparison is against
# buy-and-hold SPY either way -- which is the null a portfolio has to beat before "optimal"
# means anything.
benchmark = "SPY"

# The COLOUR CHANNEL, and why it exists separately from each asset's `asset_class`. The SPA plots
# ~120 dots; 3 hues clear the all-pairs colourblind gate and 8 do not, so `group` is a deliberate
# three-way partition and `asset_class` is the finer label that lives in the tooltip and the
# filter row. Both are recorded per asset rather than inferred from the ticker, because a prefix
# heuristic puts GLD and GDX in different groups (bullion is a real asset, a gold miner is an
# equity) and that distinction is exactly the one a reader is looking at.
groups = ["equity", "fixed_income", "real_asset_fx"]

# How each group is NAMED on the page: in the filter buttons, the tooltip, the weight table and
# the CSV export. Here rather than in the SPA because the label is a fact about this universe --
# a second universe partitions the world differently and has to be able to say so without a code
# change. `universe.py` derives a plain label ("Real asset fx") for any group missing an entry,
# which is legible enough to ship and obviously unfinished enough to notice.
#
# An INLINE table, not a `[group_labels]` section: a section header would capture every top-level
# key written after it -- `description` would silently become `group_labels.description` -- and
# the failure would look like a missing description rather than like a TOML mistake.
group_labels = { equity = "Equity", fixed_income = "Fixed income", real_asset_fx = "Real assets & FX" }

description = """
Why ETFs rather than single stocks.

Markowitz needs a covariance matrix, and a covariance matrix estimated from a sample is the
weakest part of the whole construction: with N assets it has N(N+1)/2 free parameters estimated
from N*T numbers, so at N=120 and T=3,800 daily bars the ratio of observations to parameters is
about 63 — which sounds comfortable and is not, because the errors land in the smallest
eigenvalues, and the optimiser's job is precisely to lever the smallest eigenvalues. That is the
"error maximisation" property: mean-variance optimisation is an estimation-error amplifier.

120 mega-cap US stocks correlate at 0.4-0.6 with each other and 0.7+ with the index; their
covariance matrix is near-singular in the directions that matter, and the frontier that comes out
is a thin sliver with 6-8 nonzero weights. That is a real and instructive result — it is the
error-maximisation demo — but it is a demo about estimation failure, not about diversification. A
cross-asset ETF universe has genuinely different return generators (nominal bonds, TIPS, gold,
currencies, energy) whose pairwise correlations run negative to mildly positive, so the frontier
actually bends and the tangency portfolio holds something you would recognise as a portfolio.
"""

# HISTORY DEPTH IS A HARD CONSTRAINT, NOT A PREFERENCE. A covariance matrix needs one common
# window across every asset: an asset that starts in 2018 either truncates the whole panel to
# 2018 or has to be dropped. So no entry records a start date -- `fetch.py` measures it -- but
# this list is deliberately weighted toward funds that launched before 2011, and the well-known
# late arrivals are INCLUDED and expected to be dropped by the window filter rather than quietly
# left out. They are here because the start date is a parameter: at `--start 2013-06-01` all of
# them clear, at `--start 2011-01-01` several do not, and a universe that silently omitted them
# would make that parameter look like it did nothing.
late_arrivals = """
XLRE (2015-10), XLC (2018-06)  -- the two sector-scheme additions
MTUM QUAL VLUE (2013-04)       -- the iShares factor suite
USMV (2011-10) SPLV (2011-05)  -- low-vol, marginal at a 2011-01-01 start
IEMG IEFA (2012-10), INDA (2012-02), SCHH (2011-01), VTIP (2012-10)
"""

exclusion_policy = """
Excluded as categories, without listing every ticker: leveraged and inverse funds (their
arithmetic drift makes a mean-variance input meaningless over a multi-year window), volatility
futures products, anything delisted mid-sample, and near-duplicate share classes of something
already listed. Individual symbols excluded for reasons that are NOT visible in the code are
named in [excluded] below, with the evidence.
"""

