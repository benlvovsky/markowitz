# Symbols deliberately kept out, where the reason would otherwise be invisible. This section is
# not consumed by the pipeline -- `[assets]` is the universe. It exists because "why is copper
# missing" is a question a reader will have, and the answer is not inferable from the code.
[excluded]

CPER = """
Excluded for a DATA reason, not a portfolio one. Yahoo's CPER series carries bad prints:
2014-12-03 closes at 19.52, 2014-12-04 at 13.05, 2014-12-05 back at 19.56, with copper itself
flat — a fabricated -33%/+50% round trip, and the same pattern again on 2015-02-02/03. Those two
pairs alone would make CPER the highest-variance asset in the universe and would corrupt its
whole covariance ROW, not just its own column.

Dropped by name rather than by an automated outlier filter because the signature is not separable
from real data: the same "large move immediately reversed" test fires on XOP, USO, UNG, EWZ, EWW,
XLF and GDXJ, where the moves are March 2020 and entirely real. A filter that removed those would
be deleting the most informative days in the sample. So the honest handling is a named exclusion
with the evidence written down, and a test (test_no_panel_asset_has_a_split_sized_daily_move)
that bounds what can reach the optimiser: the largest real daily move in the panel is XOP at
36.9%, CPER's artifact is 49.9%, and the bound sits between them. Copper exposure is still
present via DBB.
"""

RSX = """
Halted in 2022 after the invasion of Ukraine and delisted. Its last print is not a price — it is
the last quote before trading stopped, with the underlying market closed — so the final return is
a fiction of unknown size and the series cannot be windowed around.
"""

VXX = """
VIX futures. The roll cost is a structural ~-50%/yr, which is not a risk premium and not
stationary; with shorting off the optimiser simply assigns it zero weight, so it would add a dot
to the chart at (very high vol, very negative return) and nothing else.
"""
