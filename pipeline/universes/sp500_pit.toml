# ------------------------------------------------------------------------ reissued tickers
# THE HALF-RECYCLED CASE, and it needs its own table because `[recycled]`'s remedy is wrong for
# it. These four tickers mean one company before a date and a DIFFERENT, legitimately-current
# constituent after it, so stripping them from every snapshot -- what `[recycled]` does -- would
# delete Dow Inc, Fox Corporation and Qnity from the snapshots they really do belong to. They are
# stripped from snapshots dated BEFORE `from` and kept in the rest.
#
# `from` is the first bar the primary vendor serves under the new company, and it is checked, not
# asserted: the stored series must begin at or before the first snapshot that survives the strip,
# which is what `test_every_point_in_time_member_is_stored_back_to_the_snapshot_that_holds_it`
# requires of every ever-member. That test is how all four were found -- they were being dropped
# from the early windows by the coverage filter, under the same
# `dropped_history_starts_late` heading as a genuine post-window IPO.
#
# The cost is the same one `[recycled]` carries and is not yet counted: the pre-`from` company was
# a real constituent that is now priced by nobody, and it is not in `unpriceable`, so the stress
# bound's exposure arithmetic understates how many names are missing from the early windows. The
# run's own per-period `dropped_not_in_store` is the number to use there.
[reissued]
DOW = { from = "2019-03-20", why = "Dow Inc, spun out of DowDuPont in 2019 -- 1877 bars from 2019-03-20. The 2016 constituent under DOW was Dow Chemical, which merged into DowDuPont (DWDP, unpriceable) in 2017." }
FOX = { from = "2019-03-13", why = "Fox Corporation -- 1882 bars from 2019-03-13. The 2016-2018 constituent was Twenty-First Century Fox, whose assets went to Disney in March 2019." }
FOXA = { from = "2019-03-12", why = "Fox Corporation class A -- 1883 bars from 2019-03-12; same split as FOX." }
Q = { from = "2025-10-27", why = "Qnity Electronics, DuPont's 2025 electronics spinoff -- 216 bars from 2025-10-27. The 2017 constituent under Q was QuintilesIMS, which renamed to IQVIA in November 2017; the change log carries that as IQV from the 2018 snapshot on, so this file already holds Q in 2017 and 2026 only and the two are different companies." }

# ------------------------------------------------------- truncated by the primary vendor
# A THIRD failure mode, and the one that is hardest to see, because nothing about it looks like
# an error: the primary vendor serves these under the RIGHT company name with only a few weeks
# of history. All four begin on the same day -- 2026-07-17, with `firstTradeDate` set to it --
# which is what makes it a vendor defect rather than four coincidences. AVB is AvalonBay
# Communities (an S&P 100 REIT), EA is Electronic Arts, LEG is Leggett & Platt, BBBY is Bed
# Bath & Beyond. None of them stopped trading in 2026 and none is a reissued ticker.
#
# The behaviour is CORRECT without this table -- `load_panel`'s coverage filter drops a symbol
# with 27 bars from every window and says so -- so the cost is silent: three large caps that
# belong in every candidate set are missing from all of them, counted under
# `dropped_history_starts_late` alongside genuine post-window IPOs. They are declared here so
# that the second vendor is asked for them, and so that a test can require every ever-member's
# stored history to reach the first snapshot that holds it OR be named here. That test is the
# screen whose absence let these four through.
[truncated]
AVB = "27 stored bars 2026-07-17 -> 2026-08-24; AvalonBay Communities, still trading"
BBBY = "36 stored bars from 2026-07-17; Bed Bath & Beyond -- the second vendor 400s it, so it is unpriceable in practice and is listed there too"
EA = "6 stored bars from 2026-07-17; Electronic Arts, still trading"
LEG = "5 stored bars from 2026-07-17; Leggett & Platt, still trading"
