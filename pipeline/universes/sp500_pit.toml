# The S&P 500 AS IT STOOD AT EACH REBALANCE DATE -- one membership list per year, not one list
# used for every year. Reconstructed on 2026-09-06 by walking Wikipedia's index change log
# BACKWARDS from the current component table:
#
#   https://en.wikipedia.org/wiki/List_of_S%26P_500_companies          (503 current members)
#   https://en.wikipedia.org/wiki/Historical_components_of_the_S%26P_500  (407 changes, from 1976)
#
# For each change effective AFTER a snapshot date, the added ticker is removed and the removed
# ticker is added back. Cross-checked against the hand-verified `sp500_2023.toml`: 498 of that
# file's 503 names reproduce exactly. The 5 disagreements are all TICKER SPELLING, not
# membership -- BF.B/BF-B and BRK.B/BRK-B punctuation, and three renames the change log does
# not carry (FLT->CPAY, WRK->SW, EQR->VMRK). A rename is harmless for pricing when the vendor
# keeps the history under the new spelling; it is NOT harmless when a merger adopted the
# partner's ticker, which is why `[recycled]` below exists and is checked rather than assumed.
#
# WHY THIS FILE INSTEAD OF ONE `sp500_YYYY.toml` PER YEAR: the snapshots share ~95% of their
# names, so eleven separate universe files would be eleven copies of the same 500 lines and a
# diff between two years would be unreadable. `universe.py` does not load this file and must
# not learn to -- a universe is a set of symbols, and this is a set of symbols PER DATE.
#
# COVERAGE IS WORSE THE FURTHER BACK YOU GO, and the missing names are exactly the dead ones:
# 12.2% of the 2016 list is priced by nobody against 0.6% of the 2024 list. That is not a
# rounding error in the early windows and it is stated per snapshot in `pipeline/results/`
# rather than averaged away.

name = "S&P 500, point in time"
description = """
The index membership as it stood on 1 September of each year from 2016 to 2026, so that a
walk-forward test can choose weights from the companies that were actually in the index on the
day the weights were chosen -- not from the companies that are in it today, which is a list
that already knows who survived.

The benchmark is deliberately empty. SPY enters through `--benchmark`, priced but not
investable, for the reason given in `sp500_2023.toml`: an index fund among its own constituents
has lower variance than almost any one of them, so a minimum-variance solve buys it on sight and
the question stops being a question."""
benchmark = ""
retrieved = "2026-09-06"

# ------------------------------------------------------------------- priced by vendor two
# The primary vendor serves NOTHING for these (not a short series -- a 404, or a 200 with an
# empty timestamp array). stockanalysis.com serves them; `delisted.py` fetches and cross-checks
# them, and they reach the optimiser only through `--extra-panel`. They never enter the store.
vendor_two = ["ANSS", "ATVI", "CA", "CMA", "CTLT", "CTRA", "DAY", "DNB", "FL", "HBI", "HOLX", "IPG", "JNPR", "JWN", "K", "MON", "PDCO", "SEE", "SIVB", "SRCL", "TGNA", "TWTR", "WBA"]

# --------------------------------------------------------------------- priced by nobody
# "Priced by nobody" means NO VENDOR SERVES THE HISTORY THE WINDOWS THAT HOLD THE NAME NEED, which
# is not the same sentence as "no vendor serves the ticker" -- and the difference is two names, so
# it is stated rather than left to the reader:
#   * the other 65 return nothing from either vendor at any range;
#   * BBBY returns 36 bars from 2026-07-17 from the primary (the vendor defect in `[truncated]`)
#     and HTTP 400 from the second;
#   * SBNY returns 516 bars from 2024-08-15 from the primary -- "Signature Bank" on the pink
#     sheets, the failed bank's post-receivership shell rather than the constituent the index held
#     in 2022 -- and HTTP 400 from the second. Right company, unusable history: every window that
#     holds SBNY ends before the stub begins, so the store keeps it and the start filter drops it.
# Both were checked against the second vendor before being listed here; neither is in `vendor_two`,
# because that table is a claim that the second vendor delivers.
#
# These are bounded in a `*_stress.json` artifact rather than assumed harmless -- with 12.2% of the
# 2016 list here, "assume it does not matter" is not available.
unpriceable = ["ABMD", "ADS", "AGN", "ALXN", "ARNC", "BBBY", "BCR", "BHI", "CDAY", "CELG", "CERN", "CHK", "CTXS", "CXO", "DFS", "DISCA", "DISCK", "DISH", "DO", "DPS", "DRE", "DWDP", "ENDP", "ETFC", "FBHS", "FLIR", "FLT", "FRC", "FTR", "GGP", "GPS", "HAR", "HES", "HFC", "KSU", "LLL", "LLTC", "LM", "LVLT", "MJN", "MNK", "MRO", "MXIM", "NBL", "NLSN", "PBCT", "PXD", "RAI", "RHT", "RTN", "SBNY", "SNI", "STJ", "SWN", "TIF", "TSS", "TYC", "VAR", "VIAB", "WCG", "WFM", "WLTW", "WYN", "XEC", "XL", "XLNX", "YHOO"]

