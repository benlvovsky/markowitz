# coverage-passing series for a DIFFERENT COMPANY than the one the index removed. Every
# automatic check passes; the screen that catches them is the vendor's current `longName`
# against the company the change log says was removed, and it ran over all 103 removed-and-
# priced tickers. Three more were flagged and cleared as spelling (Aimco / Apartment
# Investment and Management, Owens-Illinois / O-I Glass, VF / V.F. Corporation).
[recycled]
APC = "ARKO Petroleum Corp, a Nasdaq Capital Market micro-cap serving 142 bars from 2026-02-12; Anadarko Petroleum was acquired by Occidental in 2019"
CSRA = "Cohen & Steers Real Assets Active ETF trades under CSRA today; CSRA Inc was acquired by General Dynamics in 2018"
EMC = "Global X Emerging Markets Great Consumer ETF; EMC Corporation was acquired by Dell in 2016"
